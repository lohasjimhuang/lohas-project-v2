<script>
    // 保留你原有的選單控制腳本
    document.addEventListener('DOMContentLoaded', () => {
        const menu = document.getElementById('mobile-menu');
        const navList = document.getElementById('nav-list');
        if (menu && navList) {
            menu.addEventListener('click', () => {
                menu.classList.toggle('active');
                navList.classList.toggle('active');
                document.body.style.overflow = navList.classList.contains('active') ? 'hidden' : 'auto';
            });
        }
    });

    // 市集專用 Modal 控制腳本
    const modal = document.getElementById("marketModal");

    function openMarketModal(title, author, imgSrc, description) {
        document.getElementById("modalTitle").innerText = title;
        document.getElementById("modalAuthor").innerText = author;
        document.getElementById("modalImg").src = imgSrc;
        document.getElementById("modalDesc").innerText = description;
        modal.style.display = "flex";
        document.body.style.overflow = "hidden"; 
    }

    function closeMarketModal() {
        modal.style.display = "none";
        document.body.style.overflow = "auto";
    }

    // 點擊背景關閉
    window.onclick = function(event) {
        if (event.target == modal) {
            closeMarketModal();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
    const filterLinks = document.querySelectorAll('.market-category-list a');
    const sections = document.querySelectorAll('.market-section');

    filterLinks.forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();

            // 1. 切換選單的 active 樣式
            filterLinks.forEach(l => l.classList.remove('active'));
            link.classList.add('active');

            // 2. 取得點擊的分類值
            const filterValue = link.getAttribute('data-filter');

            // 3. 執行篩選邏輯
            sections.forEach(section => {
                const sectionCategory = section.getAttribute('data-category');

                if (filterValue === 'all') {
                    section.style.display = 'block'; // 顯示全部
                } else if (sectionCategory === filterValue) {
                    section.style.display = 'block'; // 顯示符合的分類
                } else {
                    section.style.display = 'none';  // 隱藏不符合的分類
                }
            });
        });
    });
});

document.addEventListener('DOMContentLoaded', () => {
    const filterLinks = document.querySelectorAll('.market-category-list a');
    const sections = document.querySelectorAll('.market-section');

    // --- 1. 定義統一的篩選邏輯 ---
    function applyFilter(filterValue) {
        // 更新選單按鈕的 active 樣式
        filterLinks.forEach(link => {
            if (link.getAttribute('data-filter') === filterValue) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });

        // 根據分類顯示或隱藏區塊
        sections.forEach(section => {
            const sectionCategory = section.getAttribute('data-category');
            
            if (filterValue === 'all' || !filterValue) {
                section.style.display = 'block';
            } else if (sectionCategory === filterValue) {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        });
    }

    // --- 2. 處理點擊事件 ---
    filterLinks.forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const filterValue = link.getAttribute('data-filter');
            
            // 點擊時同步更新網址 Hash (例如 #official)，方便使用者分享
            window.location.hash = filterValue;
            applyFilter(filterValue);
        });
    });

    // --- 3. 處理外部連結進入 (關鍵) ---
    // 讀取網址列 # 後面的文字 (例如 official)
    const initialHash = window.location.hash.replace('#', '');
    if (initialHash) {
        applyFilter(initialHash);
    } else {
        applyFilter('all'); // 預設顯示全部
    }
});
    
</script>
