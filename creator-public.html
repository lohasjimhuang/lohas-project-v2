<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>創作者個人頁 · LOHAS</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    body { margin:0; padding:24px; background:#F9F8F6; min-height:100vh; font-family:"Noto Sans TC","PingFang TC",sans-serif }
    .lh-wrap { max-width:1080px; margin:0 auto }
    .cp-loading, .cp-error {
      text-align:center; padding:80px 20px;
      color:#A8927A; font-size:14px;
      background:#fff; border:1px solid #E8DFD0; border-radius:16px;
      max-width:1080px; margin:0 auto;
    }

    .lh{
      --lohas-brown:#50422D;--lohas-hover:#765F4A;--lohas-light-brown:#CDBEA2;--lohas-soft:#F9F8F6;
      --lohas-line:#E8DFD0;--lohas-text:#3D3026;--lohas-sub:#7A6B5C;--lohas-mute:#A8927A;--lohas-tip:#F4EEE3;
      --lohas-warm:#EFE6D6;
      --c-bg:#EFE9F5;--c-text:#6B5887;--c-grad:linear-gradient(135deg,#8B7BA8,#5A4A6F);--c-solid:#6B5887;
      --collab-bg:#3D2F2C;--collab-soft:#F5EFF5;
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      background:#fff;color:var(--lohas-text);border-radius:16px;overflow:hidden;border:1px solid var(--lohas-line);position:relative
    }
    .lh *{box-sizing:border-box}
    .lh button{font-family:inherit;cursor:pointer}

    /* Creator pill */
    .lh .id-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;letter-spacing:1px;padding:4px 11px;border-radius:999px;font-weight:600;line-height:1;white-space:nowrap;background:var(--c-solid);color:#fff}
    .lh .id-pill i{font-size:10px;color:#FFD86B}

    .lh .pf-topnav{display:flex;justify-content:space-between;align-items:center;padding:14px 36px;border-bottom:1px solid var(--lohas-line);background:#fff;font-size:12px;color:var(--lohas-sub);letter-spacing:1px}
    .lh .pf-topnav .crumb a{color:var(--lohas-mute);font-weight:500;text-decoration:none;cursor:pointer}
    .lh .pf-topnav .crumb a:hover{color:var(--lohas-brown)}
    .lh .pf-topnav .crumb b{color:var(--lohas-brown);font-weight:600;margin-left:6px}
    .lh .pf-topnav .actions{display:flex;gap:18px}
    .lh .pf-topnav .actions button{background:transparent;border:0;color:var(--lohas-sub);font-family:inherit;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .lh .pf-topnav .actions button:hover{color:var(--lohas-brown)}

    /* Hero */
    .lh .pf-hero{padding:48px 36px 40px;background:var(--lohas-warm);display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:flex-start}
    .lh .pf-avatar{width:200px;height:200px;border-radius:50%;background:var(--c-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:54px;font-weight:600;overflow:hidden}
    .lh .pf-avatar img{width:100%;height:100%;object-fit:cover}
    .lh .pf-body{padding-top:6px}
    .lh .pf-eb{font-size:11px;letter-spacing:5px;color:var(--lohas-mute);margin-bottom:10px;font-weight:500}
    .lh .pf-name-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
    .lh .pf-name{font-size:32px;font-weight:600;color:var(--lohas-brown);letter-spacing:1px;margin:0}
    .lh .pf-tag{font-size:13px;color:var(--lohas-sub);margin-bottom:14px;letter-spacing:0.5px}
    .lh .pf-tag .dot{color:var(--lohas-light-brown);margin:0 8px}
    .lh .pf-bio{font-size:13px;color:var(--lohas-text);line-height:1.9;margin:0 0 22px;letter-spacing:0.4px;max-width:560px;white-space:pre-wrap}
    .lh .pf-stats{display:grid;grid-template-columns:repeat(4,max-content);gap:32px;margin-bottom:22px}
    .lh .pf-stat-label{font-size:10px;color:var(--lohas-mute);letter-spacing:1.5px;margin-bottom:4px;font-weight:500}
    .lh .pf-stat-num{font-size:22px;font-weight:600;color:var(--lohas-brown);letter-spacing:1px}

    .lh .pf-social{display:flex;gap:18px;flex-wrap:wrap}
    .lh .social-link{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--lohas-sub);text-decoration:none;cursor:pointer;letter-spacing:0.3px;font-weight:500;transition:color .2s}
    .lh .social-link i{font-size:13px}
    .lh .social-link.ig:hover{color:#C13584}
    .lh .social-link.fb:hover{color:#1877F2}
    .lh .social-link.line:hover{color:#06C755}
    .lh .social-link.email:hover{color:var(--lohas-brown)}

    /* 錨點導覽 */
    .lh .anchor-nav{display:flex;justify-content:center;align-items:center;padding:24px 36px;border-bottom:1px solid var(--lohas-line);background:#fff;flex-wrap:wrap;gap:0;position:sticky;top:0;z-index:5}
    .lh .anchor{padding:6px 22px;font-size:12px;color:var(--lohas-mute);background:transparent;border:0;cursor:pointer;font-family:inherit;font-weight:400;letter-spacing:1.5px;white-space:nowrap;transition:color .2s;position:relative}
    .lh .anchor:hover{color:var(--lohas-brown)}
    .lh .anchor.on{color:var(--lohas-brown);font-weight:600}
    .lh .anchor.on::after{
      content:"";position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
      width:18px;height:1px;background:var(--lohas-brown)
    }
    .lh .anchor-divider{width:1px;height:11px;background:var(--lohas-light-brown);flex-shrink:0;opacity:0.7}

    .lh .pf-section{padding:48px 36px;border-bottom:1px solid var(--lohas-line);background:#fff;scroll-margin-top:60px}
    .lh .pf-section-eb{font-size:11px;letter-spacing:4px;color:var(--lohas-mute);margin-bottom:8px;font-weight:500;display:flex;align-items:center;gap:10px}
    .lh .pf-section-eb::before{content:"";width:18px;height:1px;background:var(--lohas-mute)}
    .lh .pf-section-h{font-size:22px;font-weight:600;margin:0 0 8px;color:var(--lohas-brown);letter-spacing:1px}
    .lh .pf-section-sub{font-size:12px;color:var(--lohas-mute);letter-spacing:0.5px;margin-bottom:24px}

    /* 緣分區 */
    .lh .joining-content{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
    .lh .joining-photo{aspect-ratio:3/4;background:#E5DDC8;background-size:cover;background-position:center;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--lohas-mute);font-size:11px;letter-spacing:2px}
    .lh .joining-text{font-size:14px;line-height:2;color:var(--lohas-text);letter-spacing:0.4px;padding-top:6px;white-space:pre-wrap}

    /* 影片區 */
    .lh .video-section{padding:56px 36px;background:var(--lohas-tip);border-bottom:1px solid var(--lohas-line);text-align:center}
    .lh .video-eb{font-size:11px;letter-spacing:5px;color:var(--lohas-mute);margin-bottom:10px;font-weight:500}
    .lh .video-h{font-size:22px;font-weight:600;color:var(--lohas-brown);letter-spacing:1px;margin:0 0 28px}
    .lh .video-frame-wrap{max-width:780px;margin:0 auto}
    .lh .yt-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 12px 40px rgba(80,66,45,.15)}
    .lh .yt-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .lh .video-caption{font-size:12px;color:var(--lohas-mute);letter-spacing:0.5px;margin-top:14px;display:inline-flex;align-items:center;gap:8px}
    .lh .video-caption i{color:#FF0000;font-size:13px}

    /* 設計 grid */
    .lh .pf-designs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .lh .pf-design{cursor:pointer;transition:transform .2s}
    .lh .pf-design:hover{transform:translateY(-3px)}
    .lh .pf-design-img{aspect-ratio:1/1;background:linear-gradient(135deg,#E5DDC8,#CDBEA2);background-size:cover;background-position:center;border-radius:12px;display:flex;align-items:center;justify-content:center;color:rgba(80,66,45,.4);font-size:13px;font-weight:600;margin-bottom:10px;text-align:center;padding:12px}
    .lh .pf-design-img.g2{background:linear-gradient(135deg,#CDBEA2,#A8927A)}
    .lh .pf-design-img.g3{background:linear-gradient(135deg,#D4C5AC,#9D8868)}
    .lh .pf-design-img.g4{background:linear-gradient(135deg,#A8927A,#765F4A);color:rgba(255,255,255,.55)}
    .lh .pf-design-name{font-size:14px;font-weight:600;color:var(--lohas-brown);margin-bottom:3px;letter-spacing:0.3px}
    .lh .pf-design-meta{font-size:11px;color:var(--lohas-mute);letter-spacing:0.5px}

    /* 故事 */
    .lh .story-row{background:var(--lohas-soft);border:1px solid var(--lohas-line);border-radius:12px;padding:18px;margin-bottom:12px;display:grid;grid-template-columns:80px 1fr auto;gap:18px;align-items:center;cursor:pointer;transition:all .2s}
    .lh .story-row:hover{border-color:var(--lohas-brown);transform:translateX(4px)}
    .lh .story-row:last-child{margin-bottom:0}
    .lh .story-thumb{aspect-ratio:1/1;background:#E5DDC8;background-size:cover;background-position:center;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--lohas-mute);font-size:9px;letter-spacing:1px}
    .lh .story-quote{font-size:14px;color:var(--lohas-text);line-height:1.7;margin:0;font-weight:500;letter-spacing:0.3px}
    .lh .story-arrow{color:var(--lohas-mute);font-size:14px}

    /* 照片 */
    .lh .photos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .lh .photo{aspect-ratio:1/1;background:linear-gradient(135deg,#E5DDC8,#CDBEA2);background-size:cover;background-position:center;border-radius:10px;cursor:pointer;transition:transform .2s}
    .lh .photo:hover{transform:scale(1.02)}
    .lh .photo.g2{background:linear-gradient(135deg,#CDBEA2,#A8927A)}
    .lh .photo.g3{background:linear-gradient(135deg,#D4C5AC,#9D8868)}

    /* Empty */
    .lh .empty-text{text-align:center;padding:40px 20px;color:var(--lohas-mute);font-size:13px;letter-spacing:0.5px}

    /* 紫色聯名卡 */
    .lh .collab-card{background:var(--collab-soft);border:1px solid #D5C7E5;border-radius:14px;padding:24px;display:grid;grid-template-columns:140px 1fr auto;gap:24px;align-items:center;cursor:pointer;transition:all .2s}
    .lh .collab-card:hover{border-color:#8B7BA8;transform:translateY(-3px);box-shadow:0 8px 24px rgba(139,123,168,.15)}
    .lh .collab-cover{aspect-ratio:1/1;background:linear-gradient(135deg,#5A4A6F 0%,#3D2F4A 100%);border-radius:10px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:13px;letter-spacing:2px;font-weight:600;text-align:center;line-height:1.4}
    .lh .collab-eb{font-size:11px;letter-spacing:4px;color:#8B7BA8;margin-bottom:6px;font-weight:600}
    .lh .collab-h{font-size:20px;font-weight:600;color:var(--lohas-brown);margin:0 0 10px;letter-spacing:0.5px}
    .lh .collab-desc{font-size:13px;line-height:1.8;color:var(--lohas-sub);margin:0 0 10px;letter-spacing:0.3px}
    .lh .collab-stats{font-size:12px;color:#6B5887;font-weight:600;letter-spacing:0.5px}
    .lh .collab-arrow{color:#8B7BA8;font-size:18px}

    .lh .pf-footer-cta{padding:64px 36px;text-align:center;background:var(--collab-bg);color:#fff}
    .lh .pf-footer-cta h3{font-size:22px;font-weight:600;margin:0 0 14px;letter-spacing:1px;color:#fff}
    .lh .pf-footer-cta p{font-size:13px;color:rgba(255,255,255,.7);margin:0 0 32px;line-height:1.9;letter-spacing:0.5px}
    .lh .pf-footer-cta .btns{display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:center;max-width:280px;margin:0 auto}
    .lh .pf-footer-cta button{padding:13px 28px;font-size:13px;letter-spacing:2px;font-family:inherit;cursor:pointer;border-radius:999px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;width:100%}
    .lh .pf-footer-cta .primary{background:#fff;color:var(--lohas-brown)}
    .lh .pf-footer-cta .ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}

    /* RWD */
    @media (max-width: 768px){
      body{padding:0}
      .lh{border-radius:0;border:0}
      .lh .pf-topnav{padding:12px 18px;font-size:11px}
      .lh .pf-topnav .actions{gap:12px}
      .lh .pf-hero{grid-template-columns:1fr;padding:32px 20px;text-align:center;gap:18px}
      .lh .pf-avatar{width:130px;height:130px;font-size:38px;margin:0 auto}
      .lh .pf-name{font-size:26px}
      .lh .pf-name-row{justify-content:center}
      .lh .pf-stats{grid-template-columns:repeat(2,1fr);gap:18px;justify-items:center}
      .lh .pf-social{justify-content:center}
      .lh .anchor-nav{padding:14px 12px;overflow-x:auto;justify-content:flex-start}
      .lh .anchor{padding:6px 14px;font-size:11px}
      .lh .pf-section{padding:32px 20px}
      .lh .joining-content{grid-template-columns:1fr;gap:20px}
      .lh .joining-photo{max-width:200px;margin:0 auto}
      .lh .pf-designs{grid-template-columns:repeat(2,1fr)}
      .lh .photos-grid{grid-template-columns:repeat(2,1fr)}
      .lh .video-section{padding:36px 20px}
      .lh .collab-card{grid-template-columns:1fr;text-align:center}
      .lh .collab-cover{max-width:160px;margin:0 auto}
      .lh .pf-footer-cta{padding:48px 20px}
    }
  </style>
</head>
<body>

<div class="lh-wrap">
  <div class="cp-loading" id="cpLoading">載入中...</div>
  <div class="lh" id="cp" style="display:none"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/supabase.js"></script>

<script>
(function () {
  'use strict';

  const grads = ['', 'g2', 'g3', 'g4'];
  const photoGrads = ['', 'g2', 'g3'];

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function getAvatarText(name) {
    if (!name) return '--';
    return name.length > 2 ? name.slice(-2) : name;
  }

  function showError(msg) {
    document.getElementById('cpLoading').innerHTML = `<i class="fa-solid fa-circle-exclamation" style="font-size:24px;color:#C97B5C;margin-bottom:12px;display:block"></i>${escapeHtml(msg)}`;
  }

  async function loadCreatorPage() {
    const params = new URLSearchParams(window.location.search);
    const erpid = params.get('id');

    if (!erpid) { showError('沒有指定創作者'); return; }

    const sb = window.LohasSupabase?.getClient();
    if (!sb) { showError('系統暫時無法使用'); return; }

    // 抓會員資料
    const { data: member } = await sb
      .from('members')
      .select('erpid, name')
      .eq('erpid', erpid)
      .maybeSingle();

    if (!member) { showError('找不到此創作者'); return; }

    // 抓創作者資料
    const { data: creatorInfo } = await sb
      .from('creator_info')
      .select('display_name, bio, avatar_url, social_links, joining_story, joining_photo_url, video_url, video_title, tagline')
      .eq('member_id', erpid)
      .maybeSingle();

    if (!creatorInfo) { showError('此會員尚未開通創作者'); return; }

    // 記錄一次瀏覽
    try {
      const stored = window.LohasAuth?.getStoredMember?.();
      await sb.from('creator_views').insert({
        creator_id: erpid,
        viewer_id: stored ? stored.erpid : null,
        user_agent: navigator.userAgent.slice(0, 200),
        referrer: document.referrer.slice(0, 200) || null
      });
    } catch (e) { console.warn('[計數失敗]', e); }

    // 抓上架設計
    const { data: designs } = await sb
      .from('engraving_designs')
      .select('id, name, image_url, design_type')
      .eq('creator_id', erpid)
      .eq('status', 'approved')
      .order('created_at', { ascending: false });

    // 抓累計使用次數
    let totalUsed = 0;
    if (designs && designs.length > 0) {
      const { count } = await sb
        .from('royalty_records')
        .select('id', { count: 'exact', head: true })
        .in('design_id', designs.map(d => d.id));
      totalUsed = count || 0;
    }

    // 抓總瀏覽數
    const { count: totalViews } = await sb
      .from('creator_views')
      .select('id', { count: 'exact', head: true })
      .eq('creator_id', erpid);

    // 抓照片
    const postsTable = (window.LohasSupabase.CONFIG && window.LohasSupabase.CONFIG.POSTS_TABLE) || 'gallery_posts';
    const { data: photos } = await sb
      .from(postsTable)
      .select('id, title, main_image_url, image_urls, type, status')
      .eq('member_id', erpid)
      .eq('status', 'approved');

    const photoOnly = (photos || []).filter(p => p.type !== 'story').slice(0, 8);
    const stories = (photos || []).filter(p => p.type === 'story').slice(0, 5);

    // 渲染
    const dn = creatorInfo.display_name || member.name || '創作者';
    const bio = creatorInfo.bio || '';
    const tagline = creatorInfo.tagline || '';
    const social = creatorInfo.social_links || {};
    const joiningStory = creatorInfo.joining_story || '';
    const joiningPhoto = creatorInfo.joining_photo_url || '';
    const videoUrl = creatorInfo.video_url || '';
    const videoTitle = creatorInfo.video_title || '';

    const avatarHtml = creatorInfo.avatar_url
      ? `<img src="${escapeHtml(creatorInfo.avatar_url)}" alt="${escapeHtml(dn)}">`
      : escapeHtml(getAvatarText(dn));

    // 社群
    const socialItems = [];
    if (social.instagram) socialItems.push(`<a class="social-link ig" href="${escapeHtml(social.instagram)}" target="_blank"><i class="fa-brands fa-instagram"></i>${escapeHtml(extractIgHandle(social.instagram) || 'Instagram')}</a>`);
    if (social.facebook) socialItems.push(`<a class="social-link fb" href="${escapeHtml(social.facebook)}" target="_blank"><i class="fa-brands fa-facebook"></i>Facebook</a>`);
    if (social.line) socialItems.push(`<a class="social-link line" href="https://line.me/ti/p/${escapeHtml(social.line)}" target="_blank"><i class="fa-brands fa-line"></i>LINE</a>`);
    if (social.email) socialItems.push(`<a class="social-link email" href="mailto:${escapeHtml(social.email)}"><i class="fa-regular fa-envelope"></i>${escapeHtml(social.email)}</a>`);

    // 設計卡
    const designsHtml = (designs && designs.length > 0)
      ? designs.slice(0, 8).map((d, i) => {
          const grad = grads[i % grads.length];
          return `
            <div class="pf-design">
              <div class="pf-design-img ${grad}" ${d.image_url ? `style="background-image:url('${escapeHtml(d.image_url)}')"` : ''}>
                ${d.image_url ? '' : escapeHtml(d.name || '')}
              </div>
              <div class="pf-design-name">${escapeHtml(d.name || '未命名')}</div>
              <div class="pf-design-meta">${escapeHtml(d.design_type || '圖案')}</div>
            </div>`;
        }).join('')
      : '<p class="empty-text" style="grid-column:1/-1">還沒上架任何設計</p>';

    // 故事
    const storiesHtml = stories.length > 0
      ? stories.map(s => {
          const cover = s.main_image_url || (Array.isArray(s.image_urls) && s.image_urls[0]) || '';
          return `
            <div class="story-row">
              <div class="story-thumb" ${cover ? `style="background-image:url('${escapeHtml(cover)}')"` : ''}></div>
              <p class="story-quote">「${escapeHtml(s.title || '')}」</p>
              <div class="story-arrow">→</div>
            </div>`;
        }).join('')
      : '<p class="empty-text">還沒寫過故事</p>';

    // 照片
    const photosHtml = photoOnly.length > 0
      ? photoOnly.map((p, i) => {
          const cover = p.main_image_url || (Array.isArray(p.image_urls) && p.image_urls[0]) || '';
          const grad = photoGrads[i % photoGrads.length];
          return `<div class="photo ${grad}" ${cover ? `style="background-image:url('${escapeHtml(cover)}')"` : ''}></div>`;
        }).join('')
      : '<p class="empty-text" style="grid-column:1/-1">還沒上傳照片</p>';

    // 影片 (從 YouTube URL 抓 video ID)
    const videoSection = videoUrl ? renderVideoSection(videoUrl, videoTitle) : '';

    // 緣分區 (joining story)
    const joiningSection = joiningStory ? `
      <div class="pf-section" id="sec-joining">
        <div class="pf-section-eb">STORY OF JOINING</div>
        <h2 class="pf-section-h">與樂活的緣分</h2>
        <div class="pf-section-sub">${escapeHtml(dn)} 是怎麼成為樂活的合作創作者的</div>
        <div class="joining-content">
          <div class="joining-photo" ${joiningPhoto ? `style="background-image:url('${escapeHtml(joiningPhoto)}')"` : ''}>
            ${joiningPhoto ? '' : '[ 配 鏡 照 片 ]'}
          </div>
          <div class="joining-text">${escapeHtml(joiningStory)}</div>
        </div>
      </div>
    ` : '';

    document.getElementById('cpLoading').style.display = 'none';
    const cp = document.getElementById('cp');
    cp.style.display = '';
    cp.innerHTML = `
      <div class="pf-topnav">
        <div class="crumb">
          <a href="index.html">LOHAS 首頁</a> &nbsp;›&nbsp;
          <a href="market.html">創作刻圖市集</a> &nbsp;›&nbsp;
          <b>${escapeHtml(dn)}</b>
        </div>
        <div class="actions">
          <button id="followBtn"><i class="fa-regular fa-bookmark"></i>追蹤</button>
          <button id="shareBtn"><i class="fa-solid fa-arrow-up-from-bracket"></i>分享</button>
        </div>
      </div>

      <div class="pf-hero">
        <div class="pf-avatar">${avatarHtml}</div>
        <div class="pf-body">
          <div class="pf-eb">L O H A S &nbsp; C R E A T O R</div>
          <div class="pf-name-row">
            <h1 class="pf-name">${escapeHtml(dn)}</h1>
            <span class="id-pill"><i class="fa-solid fa-star"></i>創作者</span>
          </div>
          ${tagline ? `<div class="pf-tag">${escapeHtml(tagline)}</div>` : ''}
          ${bio ? `<p class="pf-bio">${escapeHtml(bio)}</p>` : ''}
          <div class="pf-stats">
            <div><div class="pf-stat-label">累 積 照 片</div><div class="pf-stat-num">${photoOnly.length}</div></div>
            <div><div class="pf-stat-label">故 事 篇 數</div><div class="pf-stat-num">${stories.length}</div></div>
            <div><div class="pf-stat-label">上 架 設 計</div><div class="pf-stat-num">${(designs || []).length}</div></div>
            <div><div class="pf-stat-label">設 計 被 使 用</div><div class="pf-stat-num">${totalUsed}</div></div>
          </div>
          <div class="pf-social">${socialItems.join('') || '<span style="font-size:12px;color:var(--lohas-mute)">尚未設定聯絡方式</span>'}</div>
        </div>
      </div>

      <div class="anchor-nav">
        ${joiningStory ? '<button class="anchor on" data-target="sec-joining">與樂活的緣分</button><span class="anchor-divider"></span>' : ''}
        <button class="anchor ${joiningStory ? '' : 'on'}" data-target="sec-designs">我的設計</button>
        <span class="anchor-divider"></span>
        <button class="anchor" data-target="sec-stories">我的故事</button>
        <span class="anchor-divider"></span>
        <button class="anchor" data-target="sec-photos">我的照片</button>
      </div>

      ${joiningSection}
      ${videoSection}

      <div class="pf-section" id="sec-designs">
        <div class="pf-section-eb">DESIGNS</div>
        <h2 class="pf-section-h">我的設計</h2>
        <div class="pf-section-sub">${(designs || []).length} 件已上架</div>
        <div class="pf-designs">${designsHtml}</div>
      </div>

      <div class="pf-section" id="sec-stories">
        <div class="pf-section-eb">STORIES</div>
        <h2 class="pf-section-h">我的故事</h2>
        <div class="pf-section-sub">${stories.length} 篇已發表</div>
        ${storiesHtml}
      </div>

      <div class="pf-section" id="sec-photos">
        <div class="pf-section-eb">PHOTOS</div>
        <h2 class="pf-section-h">我的照片</h2>
        <div class="pf-section-sub">${photoOnly.length} 張公開照片</div>
        <div class="photos-grid">${photosHtml}</div>
      </div>

      <div class="pf-footer-cta">
        <h3>想看更多創作者?</h3>
        <p>樂活的創作者,每個人都有自己的位置。</p>
        <div class="btns">
          <button class="primary" onclick="location.href='market.html'"><i class="fa-solid fa-arrow-left"></i>回 到 創 作 者 市 集</button>
          <button class="ghost" onclick="location.href='gallery.html'">逛 靈 感 分 享 牆<i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>
    `;

    bindAnchors();
    bindShareFollow(dn);
  }

  function extractIgHandle(url) {
    const m = url.match(/instagram\.com\/([^/?#]+)/);
    return m ? '@' + m[1] : null;
  }

  function extractYoutubeId(url) {
    if (!url) return null;
    const patterns = [
      /youtube\.com\/watch\?v=([^&]+)/,
      /youtu\.be\/([^?&]+)/,
      /youtube\.com\/embed\/([^?&]+)/
    ];
    for (const p of patterns) {
      const m = url.match(p);
      if (m) return m[1];
    }
    return null;
  }

  function renderVideoSection(url, title) {
    const videoId = extractYoutubeId(url);
    if (!videoId) return '';
    return `
      <div class="video-section">
        <div class="video-eb">— V I D E O</div>
        <h2 class="video-h">${escapeHtml(title || '創作者影片')}</h2>
        <div class="video-frame-wrap">
          <div class="yt-frame">
            <iframe src="https://www.youtube.com/embed/${videoId}" title="${escapeHtml(title || '')}" allowfullscreen></iframe>
          </div>
          <div class="video-caption"><i class="fa-brands fa-youtube"></i>創作者影片</div>
        </div>
      </div>`;
  }

  function bindAnchors() {
    document.querySelectorAll('.anchor').forEach(a => {
      a.addEventListener('click', () => {
        document.querySelectorAll('.anchor').forEach(x => x.classList.remove('on'));
        a.classList.add('on');
        const target = document.getElementById(a.dataset.target);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function bindShareFollow(name) {
    document.getElementById('followBtn')?.addEventListener('click', () => {
      alert('追蹤功能即將推出');
    });
    document.getElementById('shareBtn')?.addEventListener('click', () => {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({ title: name + ' · LOHAS 創作者', url }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => alert('連結已複製到剪貼簿'));
      } else {
        prompt('請複製連結:', url);
      }
    });
  }

  document.addEventListener('DOMContentLoaded', loadCreatorPage);
})();
</script>

</body>
